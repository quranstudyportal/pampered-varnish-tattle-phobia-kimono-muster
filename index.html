<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuran Okulu — Dönem Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ── RENK TOKENLARI ──────────────────────────────────────────
           Projedeki TÜM renkler buradan türer. Palet değişimi = bu blok.
           Bootstrap'in semantik değişkenleri de buraya bağlandığı için
           yüzde eşiklerinin (bg-danger/bg-warning/bg-success) mantığı
           değişmeden rengi temaya uyar. */
        :root {
            --c-brand:        #25375F;   /* ana marka — nav, RKO başlığı, aktif filtre */
            --c-brand-2:      #339999;   /* marka gradyan ucu */
            --c-accent:       #B85C38;   /* ikincil vurgu — öğretmen başlığı */
            --c-accent-2:     #2E2219;

            --c-ok:           #7A9155;   /* yüzde ≥70 ve "Yeni" satırı */
            --c-warn:         #B57F24;   /* yüzde 25–70 */
            --c-bad:          #D9644A;   /* yüzde <25 */
            --c-scholar:      #8A5E12;   /* burslu satırı */

            --c-bg:           #F4F1EB;   /* sayfa zemini */
            --c-surface:      #FAF9F6;   /* kart zemini */
            --c-text:         #25375F;

            --c-border:       rgba(37,55,95,0.10);
            --c-border-2:     rgba(37,55,95,0.22);
            --c-shadow:       rgba(37,55,95,0.06);
            --c-shadow-lg:    rgba(37,55,95,0.14);
            --c-zebra:        rgba(37,55,95,0.045);
            --c-ink-soft:     rgba(37,55,95,0.55);

            /* Mevsim aksanları */
            --c-bahar:   #6B7C51;  --c-bahar-2: #C5D098;
            --c-yaz:     #C8922F;  --c-yaz-2:   #F4C430;
            --c-guz:     #B85C38;  --c-guz-2:   #F0A57D;
            --c-kis:     #25375F;  --c-kis-2:   #3AADA3;
            --c-bahar-bg: #E8EDDF; --c-bahar-fg: #3F4C2C;
            --c-yaz-bg:   #FAEFD5; --c-yaz-fg:   #6B4A0E;
            --c-guz-bg:   #F7E4DA; --c-guz-fg:   #7A3418;
            --c-kis-bg:   #DCEDEB; --c-kis-fg:   #17544F;

            /* Grafik serileri — program sayısı kadar sırayla kullanılır */
            --c-series-1: #25375F;
            --c-series-2: #3AADA3;
            --c-series-3: #B85C38;
            --c-series-4: #C8922F;
            --c-series-5: #6B7C51;
            --c-series-6: #D4B896;
            --c-series-7: #56D8CC;
            --c-series-8: #33404E;

            /* Bootstrap köprüsü — utility sınıfları -rgb değişkenlerini okur,
               bu yüzden hem düz hem rgb biçimi tanımlanır. Yüzde eşiklerinin
               mantığı değişmez, yalnızca renkleri palete döner. */
            --bs-primary: var(--c-brand);      --bs-primary-rgb: 37,55,95;
            --bs-success: var(--c-ok);         --bs-success-rgb: 122,145,85;
            --bs-warning: var(--c-warn);       --bs-warning-rgb: 181,127,36;
            --bs-danger:  var(--c-bad);        --bs-danger-rgb:  217,100,74;
            --bs-dark:    #1A2540;             --bs-dark-rgb:    26,37,64;
            --bs-secondary-color: var(--c-ink-soft);
            --bs-body-bg: var(--c-bg);         --bs-body-bg-rgb: 244,241,235;
            --bs-body-color: var(--c-text);    --bs-body-color-rgb: 37,55,95;
            --bs-emphasis-color-rgb: 37,55,95;
            --bs-border-color: var(--c-border-2);
        }
        [data-bs-theme="dark"] {
            --c-bg:        #25375F;
            --c-surface:   #33404E;
            --c-text:      #F4F1EB;
            --c-border:    rgba(244,241,235,0.16);
            --c-border-2:  rgba(244,241,235,0.32);
            --c-shadow:    rgba(26,37,64,0.42);
            --c-shadow-lg: rgba(26,37,64,0.60);
            --c-zebra:     rgba(244,241,235,0.08);
            --c-ink-soft:  rgba(244,241,235,0.55);
            --c-scholar:   #F4C430;
            --c-bahar-bg: #2A3328; --c-bahar-fg: #C5D098;
            --c-yaz-bg:   #3A2A0C; --c-yaz-fg:   #F4C430;
            --c-guz-bg:   #3A241A; --c-guz-fg:   #F0A57D;
            --c-kis-bg:   #14343B; --c-kis-fg:   #56D8CC;

            --bs-body-bg-rgb: 37,55,95;
            --bs-body-color-rgb: 244,241,235;
            --bs-emphasis-color-rgb: 244,241,235;
            --bs-dark: #1A2540;    --bs-dark-rgb: 26,37,64;
            /* Koyu zeminle çakışan iki seri, sitenin -on-dark yöntemiyle açıldı */
            --c-series-1: #8FA8D8;
            --c-series-8: #A9B4C4;
        }
        /* ── BOOTSTRAP YÜZEYLERİ ──────────────────────────────────────
           Bootstrap'in derlenmiş bileşenleri (butonlar, liste, tablo,
           progress) kendi --bs-* değişkenlerini okur; hepsi token'lara
           bağlandı ki palet dışında hiçbir yüzey kalmasın. */
        :root {
            --c-on-brand: #F4F1EB;   /* koyu marka zeminler üstündeki metin */

            --c-ok-text: #54613F;    /* "Yeni" satırı — metin boyu kontrast */
            --bs-secondary-rgb: 101,113,140;
            --bs-emphasis-color: var(--c-text);
        }
        [data-bs-theme="dark"] {
            --c-ok-text: #C5D098;
            --bs-secondary-rgb: 176,183,199;
        }
        .card       { --bs-card-bg: var(--c-surface); --bs-card-border-color: var(--c-border); }
        .list-group { --bs-list-group-bg: var(--c-surface); --bs-list-group-color: var(--c-text);
                      --bs-list-group-border-color: var(--c-border);
                      --bs-list-group-action-hover-bg: var(--c-zebra); }
        .table      { --bs-table-color: var(--c-text); --bs-table-bg: transparent;
                      --bs-table-striped-color: var(--c-text); --bs-table-striped-bg: var(--c-zebra);
                      --bs-table-hover-color: var(--c-text); --bs-table-hover-bg: var(--c-border);
                      --bs-table-border-color: var(--c-border); }
        /* Koyu temada rozetler ters çevrilir: marka lacivertli dolgu koyu kart
           üstünde kayboluyordu (1.11:1), açık dolgu + koyu metin okunur kalır. */
        [data-bs-theme="dark"] .badge.bg-primary {
            --bs-primary-rgb: 86,216,204; --bs-badge-color: var(--c-brand); color: var(--c-brand);
        }
        /* Özet bandındaki büyük sayı: text-primary koyu zeminde kayboluyordu. */
        [data-bs-theme="dark"] .text-primary { color: var(--c-kis-2) !important; }
        [data-bs-theme="dark"] .badge.bg-dark {
            --bs-dark-rgb: 244,241,235; --bs-badge-color: var(--c-brand); color: var(--c-brand);
        }
        .progress   { --bs-progress-bg: var(--c-border-2); }
        .btn-outline-primary {
            --bs-btn-color: var(--c-brand); --bs-btn-border-color: var(--c-brand);
            --bs-btn-hover-color: var(--c-on-brand); --bs-btn-hover-bg: var(--c-brand);
            --bs-btn-hover-border-color: var(--c-brand);
            --bs-btn-active-color: var(--c-on-brand); --bs-btn-active-bg: var(--c-brand);
            --bs-btn-active-border-color: var(--c-brand);
        }
        [data-bs-theme="dark"] .btn-outline-primary {
            --bs-btn-color: var(--c-kis-2); --bs-btn-border-color: var(--c-kis-2);
            --bs-btn-hover-bg: var(--c-kis-2); --bs-btn-hover-color: var(--c-brand);
            --bs-btn-hover-border-color: var(--c-kis-2);
        }
        .btn-outline-warning {
            --bs-btn-color: var(--c-yaz-2); --bs-btn-border-color: var(--c-yaz-2);
            --bs-btn-hover-color: var(--c-brand); --bs-btn-hover-bg: var(--c-yaz-2);
            --bs-btn-hover-border-color: var(--c-yaz-2);
        }
        .btn-outline-secondary {
            --bs-btn-color: var(--c-text); --bs-btn-border-color: var(--c-border-2);
            --bs-btn-hover-color: var(--c-on-brand); --bs-btn-hover-bg: var(--c-brand);
            --bs-btn-hover-border-color: var(--c-brand);
            --bs-btn-active-color: var(--c-on-brand); --bs-btn-active-bg: var(--c-brand);
            --bs-btn-active-border-color: var(--c-brand);
        }
        .btn-outline-light {
            --bs-btn-color: var(--c-on-brand); --bs-btn-border-color: rgba(244,241,235,0.45);
            --bs-btn-hover-color: var(--c-brand); --bs-btn-hover-bg: var(--c-on-brand);
            --bs-btn-hover-border-color: var(--c-on-brand);
        }
        body { transition: background-color 0.3s, color 0.3s; padding-bottom: 60px; font-family: 'Segoe UI', system-ui, sans-serif; }

        /* ── NAV ── */
        .top-nav { background: var(--c-brand); color: white; padding: 12px 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px var(--c-shadow-lg); }
        .top-nav h1 { font-size: 1.1rem; font-weight: 700; margin: 0; }
        .top-nav .subtitle { font-size: 0.7rem; opacity: 0.65; margin: 0; }

        /* ── ÖZET KARTLAR ── */
        .stat-card { border: none; border-radius: 12px; box-shadow: 0 2px 10px var(--c-shadow); }
        .stat-card .stat-num { font-size: 1.7rem; font-weight: 700; line-height: 1; }
        .stat-card .stat-label { font-size: 0.68rem; opacity: 0.65; margin-top: 4px; }

        /* ── GRAFİK ── */
        .chart-card { border: none; border-radius: 16px; box-shadow: 0 4px 20px var(--c-shadow); }
        .chart-card .card-header { background: transparent; border-bottom: 1px solid var(--c-border); padding: 14px 16px 10px; }

        /* ── FİLTRE BUTONLARI ── */
        .filter-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .filter-btn {
            font-size: 0.72rem;
            padding: 5px 10px;
            border-radius: 20px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn.active { background: var(--c-brand); color: white; border-color: var(--c-brand); }

        /* ── DÖNEM KARTLARI ── */
        .semester-card { border: none; border-radius: 16px; box-shadow: 0 4px 16px var(--c-shadow); transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; display: block; overflow: hidden; }
        .semester-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px var(--c-shadow-lg); color: inherit; }
        .semester-card .card-top { padding: 16px 18px 12px; }
        .semester-card .term-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.55; }
        .semester-card .term-name { font-size: 1.2rem; font-weight: 700; margin: 2px 0 0; }
        .semester-card .card-stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--c-border); }
        .semester-card .cs-item { padding: 10px 18px; border-right: 1px solid var(--c-border); }
        .semester-card .cs-item:last-child { border-right: none; }
        .semester-card .cs-num { font-size: 1.3rem; font-weight: 700; line-height: 1; }
        .semester-card .cs-lbl { font-size: 0.62rem; opacity: 0.55; margin-top: 2px; }
        .semester-card .card-footer-bar { height: 4px; }
        .season-bahar .card-footer-bar { background: linear-gradient(90deg, var(--c-bahar), var(--c-bahar-2)); }
        .season-yaz   .card-footer-bar { background: linear-gradient(90deg, var(--c-yaz), var(--c-yaz-2)); }
        .season-guz   .card-footer-bar { background: linear-gradient(90deg, var(--c-guz), var(--c-guz-2)); }
        .season-kis   .card-footer-bar { background: linear-gradient(90deg, var(--c-kis), var(--c-kis-2)); }

        .badge-season { font-size: 0.62rem; padding: 3px 8px; border-radius: 10px; font-weight: 600; }
        .badge-bahar { background: var(--c-bahar-bg); color: var(--c-bahar-fg); }
        .badge-yaz   { background: var(--c-yaz-bg); color: var(--c-yaz-fg); }
        .badge-guz   { background: var(--c-guz-bg); color: var(--c-guz-fg); }
        .badge-kis   { background: var(--c-kis-bg); color: var(--c-kis-fg); }

        .semester-card.upcoming { opacity: 0.55; border: 2px dashed var(--c-border-2); box-shadow: none; }
        .semester-card.upcoming:hover { opacity: 0.7; transform: none; box-shadow: none; }

        /* ── DARK MODE ── */

        .section-title { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.45; margin-bottom: 12px; }

        /* ── MOBİL GRAFIK YÜKSEKLİĞİ ── */
        .chart-canvas-wrap { height: 260px; }
        @media (min-width: 768px) { .chart-canvas-wrap { height: 320px; } }
    </style>
</head>
<body>

<nav class="top-nav">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h1>Kuran Okulu (RKO)</h1>
            <p class="subtitle">Kayıt Takip Dashboard</p>
        </div>
        <button id="themeToggle" class="btn btn-sm btn-outline-light">🌙 Dark</button>
    </div>
</nav>

<div class="container mt-3">

    <!-- ÖZET BANDI -->
    <div class="row g-2 mb-3">
        <div class="col-4">
            <div class="stat-card card p-2 p-md-3 text-center">
                <div class="stat-num text-primary" id="stat-total">—</div>
                <div class="stat-label">Toplam Öğrenci</div>
            </div>
        </div>
        <div class="col-4">
            <div class="stat-card card p-2 p-md-3 text-center">
                <div class="stat-num text-success" id="stat-new">—</div>
                <div class="stat-label">Yeni Kayıt</div>
            </div>
        </div>
        <div class="col-4">
            <div class="stat-card card p-2 p-md-3 text-center">
                <div class="stat-num text-warning" id="stat-teacher-rate">—</div>
                <div class="stat-label">Kayıt Yineleme</div>
            </div>
        </div>
    </div>

    <!-- GRAFİK -->
    <div class="chart-card card mb-4">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h6 class="mb-0 fw-bold" style="font-size:0.9rem;">Program Bazlı Karşılaştırma</h6>
                    <small class="opacity-50" style="font-size:0.7rem;">Kayıt sayıları dönemlere göre</small>
                </div>
            </div>
            <!-- Program filtreleri — alt satırda, wrap eder -->
            <div class="filter-wrap" id="program-filters"></div>
        </div>
        <div class="card-body p-2 p-md-3">
            <div class="chart-canvas-wrap">
                <canvas id="mainChart"></canvas>
            </div>
        </div>
    </div>

    <!-- DÖNEM KARTLARI -->
    <div class="section-title">Dönemler</div>
    <div class="row g-3" id="semester-grid"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── DÖNEM TANIMI ─────────────────────────────────────────────────
const SEMESTERS = [
    { id: '2026-bahar', label: '2026 Bahar', season: 'bahar', year: 2026, url: './2026-bahar/index.html', dataUrl: './2026-bahar/kayit.json' },
    { id: '2026-yaz',   label: '2026 Yaz',   season: 'yaz',   year: 2026, url: './2026-yaz/index.html',   dataUrl: './2026-yaz/kayit.json'   },
    { id: '2026-guz',   label: '2026 Güz',   season: 'guz',   year: 2026, url: './2026-guz/index.html',   dataUrl: './2026-guz/kayit.json'   }
];

// ── RENK YARDIMCILARI — tek kaynak: :root token'ları ──────────────
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const seriesColors = () =>
    Array.from({ length: 8 }, (_, i) => cssVar(`--c-series-${i + 1}`)).filter(Boolean);

let allData = {}, chart = null, activePrograms = new Set();

async function loadAllData() {
    const results = await Promise.all(
        SEMESTERS.filter(s => s.dataUrl).map(s =>
            fetch(s.dataUrl)
                .then(r => r.ok ? r.json() : null)
                .then(data => ({ id: s.id, data }))
                .catch(() => ({ id: s.id, data: null }))
        )
    );
    results.forEach(r => { if (r.data) allData[r.id] = r.data; });
}

function getAllPrograms() {
    const programs = new Set();
    Object.values(allData).forEach(d => {
        (d.rko || []).forEach(p => programs.add(p.name));
    });
    return [...programs];
}

function updateSummary() {
    const loaded = SEMESTERS.filter(s => allData[s.id]);
    const lastData = loaded.length ? allData[loaded[loaded.length - 1].id] : null;
    let totalStudents = 0, newStudents = 0, arrived = 0, teacherTotal = 0;
    if (lastData) {
        (lastData.rko || []).forEach(p => {
            totalStudents += p.count || 0;
            newStudents   += p.new   || 0;
        });
        (lastData.teachers || []).forEach(t => { arrived += t.arrived; teacherTotal += t.total; });
    }
    document.getElementById('stat-total').textContent        = totalStudents || '—';
    document.getElementById('stat-new').textContent          = newStudents   || '—';
    document.getElementById('stat-teacher-rate').textContent = teacherTotal > 0 ? `%${Math.round(arrived / teacherTotal * 100)}` : '—';
}

function renderChart() {
    const ctx = document.getElementById('mainChart').getContext('2d');
    if (chart) chart.destroy();
    const gridColor = cssVar('--c-border');
    const textColor = cssVar('--c-ink-soft');
    const labels    = SEMESTERS.filter(s => allData[s.id]).map(s => s.label);
    const programs  = getAllPrograms().filter(p => activePrograms.size === 0 || activePrograms.has(p));
    const series    = seriesColors();
    const datasets  = programs.map((prog, i) => {
        const color = series[i % series.length];
        const data  = SEMESTERS.filter(s => allData[s.id]).map(s => {
            const d = allData[s.id];
            const found = (d.rko || []).find(p => p.name === prog);
            return found ? (found.count || 0) : 0;
        });
        return { label: prog, data, backgroundColor: color, borderColor: color, borderWidth: 1.5, borderRadius: 4 };
    });
    chart = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { color: textColor, boxWidth: 10, padding: 10, font: { size: 10 } } },
                tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.raw} öğrenci` } }
            },
            scales: {
                x: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 11 } } },
                y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor, stepSize: 20, font: { size: 11 } } }
            }
        }
    });
}

function buildProgramFilters() {
    const container = document.getElementById('program-filters');
    container.innerHTML = '';
    getAllPrograms().forEach(prog => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn btn btn-sm btn-outline-secondary';
        btn.textContent = prog;
        btn.addEventListener('click', () => {
            btn.classList.toggle('active');
            if (activePrograms.has(prog)) activePrograms.delete(prog); else activePrograms.add(prog);
            renderChart();
        });
        container.appendChild(btn);
    });
}

function buildSemesterCards() {
    const grid = document.getElementById('semester-grid');
    grid.innerHTML = '';
    const seasonNames = { bahar: 'Bahar', yaz: 'Yaz', guz: 'Güz', kis: 'Kış' };
    SEMESTERS.forEach(s => {
        const data = allData[s.id];
        let totalStudents = 0, teacherArrived = 0, teacherTotal = 0;
        if (data) {
            (data.rko || []).forEach(p => totalStudents += (p.count || 0));
            (data.teachers || []).forEach(t => { teacherArrived += t.arrived; teacherTotal += t.total; });
        }
        const teacherRate = teacherTotal > 0 ? Math.round(teacherArrived / teacherTotal * 100) : 0;
        const isUpcoming  = !s.dataUrl;
        const col = document.createElement('div');
        col.className = 'col-6 col-md-4';
        col.innerHTML = `
            <a href="${s.url}" class="semester-card season-${s.season}${isUpcoming ? ' upcoming' : ''}">
                <div class="card-top">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="term-label">${s.year}</div>
                        <span class="badge-season badge-${s.season}">${seasonNames[s.season] || s.season}</span>
                    </div>
                    <div class="term-name">${s.label}</div>
                    ${isUpcoming ? '<div style="font-size:0.72rem;opacity:0.5;margin-top:4px;">Yakında</div>' : ''}
                </div>
                ${data ? `
                <div class="card-stats">
                    <div class="cs-item"><div class="cs-num">${totalStudents}</div><div class="cs-lbl">Öğrenci</div></div>
                    <div class="cs-item"><div class="cs-num">%${teacherRate}</div><div class="cs-lbl">Kayıt Yineleme</div></div>
                </div>` : ''}
                <div class="card-footer-bar"></div>
            </a>`;
        grid.appendChild(col);
    });
}

document.getElementById('themeToggle').addEventListener('click', () => {
    const t = document.documentElement.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-bs-theme', t);
    document.getElementById('themeToggle').textContent = t === 'light' ? '🌙 Dark' : '☀️ Light';
    renderChart();
});

document.addEventListener('DOMContentLoaded', async () => {
    await loadAllData();
    updateSummary();
