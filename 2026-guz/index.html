<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuran Okulu — 2026 Güz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ── RENK TOKENLARI ──────────────────────────────────────────
           Projedeki TÜM renkler buradan türer. Palet değişimi = bu blok.
           Bootstrap'in semantik değişkenleri de buraya bağlandığı için
           yüzde eşiklerinin (bg-danger/bg-warning/bg-success) mantığı
           değişmeden rengi temaya uyar. */
        :root {
            --c-brand:        #25375F;   /* ana marka — nav, RKO başlığı, aktif filtre */
            --c-brand-2:      #339999;   /* marka gradyan ucu */
            --c-accent:       #B85C38;   /* ikincil vurgu — öğretmen başlığı */
            --c-accent-2:     #2E2219;

            --c-ok:           #7A9155;   /* yüzde ≥70 ve "Yeni" satırı */
            --c-warn:         #B57F24;   /* yüzde 25–70 */
            --c-bad:          #D9644A;   /* yüzde <25 */
            --c-scholar:      #8A5E12;   /* burslu satırı */
            --c-ongoing:      #A9B0BE;   /* dersi süren öğrenci — nötr gri dilim */
            --c-ongoing-text: #2E3648;   /* gri dilim ve not satırı üstündeki metin */

            --c-bg:           #F4F1EB;   /* sayfa zemini */
            --c-surface:      #FAF9F6;   /* kart zemini */
            --c-text:         #25375F;

            --c-border:       rgba(37,55,95,0.10);
            --c-border-2:     rgba(37,55,95,0.22);
            --c-shadow:       rgba(37,55,95,0.06);
            --c-shadow-lg:    rgba(37,55,95,0.14);
            --c-zebra:        rgba(37,55,95,0.045);
            --c-ink-soft:     rgba(37,55,95,0.55);

            /* Mevsim aksanları */
            --c-bahar:   #6B7C51;  --c-bahar-2: #C5D098;
            --c-yaz:     #C8922F;  --c-yaz-2:   #F4C430;
            --c-guz:     #B85C38;  --c-guz-2:   #F0A57D;
            --c-kis:     #25375F;  --c-kis-2:   #3AADA3;
            --c-bahar-bg: #E8EDDF; --c-bahar-fg: #3F4C2C;
            --c-yaz-bg:   #FAEFD5; --c-yaz-fg:   #6B4A0E;
            --c-guz-bg:   #F7E4DA; --c-guz-fg:   #7A3418;
            --c-kis-bg:   #DCEDEB; --c-kis-fg:   #17544F;

            /* Grafik serileri — program sayısı kadar sırayla kullanılır */
            --c-series-1: #25375F;
            --c-series-2: #3AADA3;
            --c-series-3: #B85C38;
            --c-series-4: #C8922F;
            --c-series-5: #6B7C51;
            --c-series-6: #D4B896;
            --c-series-7: #56D8CC;
            --c-series-8: #33404E;

            /* Bootstrap köprüsü — utility sınıfları -rgb değişkenlerini okur,
               bu yüzden hem düz hem rgb biçimi tanımlanır. Yüzde eşiklerinin
               mantığı değişmez, yalnızca renkleri palete döner. */
            --bs-primary: var(--c-brand);      --bs-primary-rgb: 37,55,95;
            --bs-success: var(--c-ok);         --bs-success-rgb: 122,145,85;
            --bs-warning: var(--c-warn);       --bs-warning-rgb: 181,127,36;
            --bs-danger:  var(--c-bad);        --bs-danger-rgb:  217,100,74;
            --bs-dark:    #1A2540;             --bs-dark-rgb:    26,37,64;
            --bs-secondary-color: var(--c-ink-soft);
            --bs-body-bg: var(--c-bg);         --bs-body-bg-rgb: 244,241,235;
            --bs-body-color: var(--c-text);    --bs-body-color-rgb: 37,55,95;
            --bs-emphasis-color-rgb: 37,55,95;
            --bs-border-color: var(--c-border-2);
        }
        [data-bs-theme="dark"] {
            --c-bg:        #25375F;
            --c-surface:   #33404E;
            --c-text:      #F4F1EB;
            --c-border:    rgba(244,241,235,0.16);
            --c-border-2:  rgba(244,241,235,0.32);
            --c-shadow:    rgba(26,37,64,0.42);
            --c-shadow-lg: rgba(26,37,64,0.60);
            --c-zebra:     rgba(244,241,235,0.08);
            --c-ink-soft:  rgba(244,241,235,0.55);
            --c-scholar:   #F4C430;
            --c-ongoing:      #6E7789;
            --c-ongoing-text: #F4F1EB;
            --c-bahar-bg: #2A3328; --c-bahar-fg: #C5D098;
            --c-yaz-bg:   #3A2A0C; --c-yaz-fg:   #F4C430;
            --c-guz-bg:   #3A241A; --c-guz-fg:   #F0A57D;
            --c-kis-bg:   #14343B; --c-kis-fg:   #56D8CC;

            --bs-body-bg-rgb: 37,55,95;
            --bs-body-color-rgb: 244,241,235;
            --bs-emphasis-color-rgb: 244,241,235;
            --bs-dark: #1A2540;    --bs-dark-rgb: 26,37,64;
            /* Koyu zeminle çakışan iki seri, sitenin -on-dark yöntemiyle açıldı */
            --c-series-1: #8FA8D8;
            --c-series-8: #A9B4C4;
        }
        /* ── BOOTSTRAP YÜZEYLERİ ──────────────────────────────────────
           Bootstrap'in derlenmiş bileşenleri (butonlar, liste, tablo,
           progress) kendi --bs-* değişkenlerini okur; hepsi token'lara
           bağlandı ki palet dışında hiçbir yüzey kalmasın. */
        :root {
            --c-on-brand: #F4F1EB;   /* koyu marka zeminler üstündeki metin */

            --c-ok-text: #54613F;    /* "Yeni" satırı — metin boyu kontrast */
            --bs-secondary-rgb: 101,113,140;
            --bs-emphasis-color: var(--c-text);
        }
        [data-bs-theme="dark"] {
            --c-ok-text: #C5D098;
            --bs-secondary-rgb: 176,183,199;
        }
        .card       { --bs-card-bg: var(--c-surface); --bs-card-border-color: var(--c-border); }
        .list-group { --bs-list-group-bg: var(--c-surface); --bs-list-group-color: var(--c-text);
                      --bs-list-group-border-color: var(--c-border);
                      --bs-list-group-action-hover-bg: var(--c-zebra); }
        .table      { --bs-table-color: var(--c-text); --bs-table-bg: transparent;
                      --bs-table-striped-color: var(--c-text); --bs-table-striped-bg: var(--c-zebra);
                      --bs-table-hover-color: var(--c-text); --bs-table-hover-bg: var(--c-border);
                      --bs-table-border-color: var(--c-border); }
        /* Koyu temada rozetler ters çevrilir: marka lacivertli dolgu koyu kart
           üstünde kayboluyordu (1.11:1), açık dolgu + koyu metin okunur kalır. */
        [data-bs-theme="dark"] .badge.bg-primary {
            --bs-primary-rgb: 86,216,204; --bs-badge-color: var(--c-brand); color: var(--c-brand);
        }
        [data-bs-theme="dark"] .badge.bg-dark {
            --bs-dark-rgb: 244,241,235; --bs-badge-color: var(--c-brand); color: var(--c-brand);
        }
        .progress   { --bs-progress-bg: var(--c-border-2); }
        .btn-outline-primary {
            --bs-btn-color: var(--c-brand); --bs-btn-border-color: var(--c-brand);
            --bs-btn-hover-color: var(--c-on-brand); --bs-btn-hover-bg: var(--c-brand);
            --bs-btn-hover-border-color: var(--c-brand);
            --bs-btn-active-color: var(--c-on-brand); --bs-btn-active-bg: var(--c-brand);
            --bs-btn-active-border-color: var(--c-brand);
        }
        [data-bs-theme="dark"] .btn-outline-primary {
            --bs-btn-color: var(--c-kis-2); --bs-btn-border-color: var(--c-kis-2);
            --bs-btn-hover-bg: var(--c-kis-2); --bs-btn-hover-color: var(--c-brand);
            --bs-btn-hover-border-color: var(--c-kis-2);
        }
        .btn-outline-warning {
            --bs-btn-color: var(--c-yaz-2); --bs-btn-border-color: var(--c-yaz-2);
            --bs-btn-hover-color: var(--c-brand); --bs-btn-hover-bg: var(--c-yaz-2);
            --bs-btn-hover-border-color: var(--c-yaz-2);
        }
        .btn-outline-secondary {
            --bs-btn-color: var(--c-text); --bs-btn-border-color: var(--c-border-2);
            --bs-btn-hover-color: var(--c-on-brand); --bs-btn-hover-bg: var(--c-brand);
            --bs-btn-hover-border-color: var(--c-brand);
            --bs-btn-active-color: var(--c-on-brand); --bs-btn-active-bg: var(--c-brand);
            --bs-btn-active-border-color: var(--c-brand);
        }
        .btn-outline-light {
            --bs-btn-color: var(--c-on-brand); --bs-btn-border-color: rgba(244,241,235,0.45);
            --bs-btn-hover-color: var(--c-brand); --bs-btn-hover-bg: var(--c-on-brand);
            --bs-btn-hover-border-color: var(--c-on-brand);
        }
        body {
            transition: background-color 0.3s, color 0.3s;
            padding-top: 20px;
            padding-bottom: 50px;
        }
        .card {
            margin-bottom: 20px;
            border: none;
            box-shadow: 0 4px 6px var(--c-shadow);
        }
        .header-rko { background-color: var(--c-brand); color: white; }
        /* Koyu temada sayfa zemini de lacivert; başlık bandı kaybolmasın diye
           marka bir ton açılır (beyaz metinle 4.5:1 üstünde kalır). */
        [data-bs-theme="dark"] .header-rko { background-color: #4A6FA5; }
        .header-teachers { background-color: var(--c-accent); color: white; }
        /* ── DEVAM EDEN DERS ──────────────────────────────────────────
           Kayıt döneminde dersi süren öğrenci yeni kayıt açamaz; bu yüzden
           "gelmedi" sayılmaz. Barda gelenin yanına nötr gri dilim olarak
           yığılır, çatı yüzde ikisinin toplamıdır. */
        .bar-ongoing { background-color: var(--c-ongoing); color: var(--c-ongoing-text); }
        .pct-roof { font-size: 0.72rem; font-weight: 700; min-width: 44px; text-align: right; }
        .ongoing-note { font-size: 0.68rem; line-height: 1.2; color: var(--c-ongoing-text); opacity: 0.8; }
        .teacher-legend { font-size: 0.68rem; opacity: 0.9; }
        .lg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin: 0 4px 0 10px; }
        .lg-dot:first-child { margin-left: 0; }
        .lg-arrived { background-color: var(--c-ok); }
        .lg-ongoing { background-color: var(--c-ongoing); }
        /* Satır yüksekliğini kompakt tutar: iki satırlık sayı hücresi ve
           bar aynı yükseklikte kalsın. */
        #teachers-list > tr > td { padding-top: 0.4rem; padding-bottom: 0.4rem; vertical-align: middle; }
        /* Dar ekranda bar birkaç yüz piksele iner; dilim etiketleri kırpılır.
           Etiketler gizlenir, bilgi kaybı olmaz: sayı hücresi gelen/toplam ve
           devam eden ders sayısını, sağdaki çatı yüzde de toplamı taşır. */
        @media (max-width: 575.98px) {
            .progress-bar { font-size: 0; }
            .pct-roof { min-width: 34px; font-size: 0.68rem; }
        }
        .total-row {
            font-weight: bold;
            background-color: var(--c-zebra) !important;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <a href="../index.html" class="btn btn-outline-secondary btn-sm">← Dashboard</a><br>
            <h1 class="fw-bold mb-0">2026 Güz</h1>
        </div>
        <button id="themeToggle" class="btn btn-outline-primary">🌙 Dark Mod</button>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header header-rko text-center">
                    <h4>Kuran Okulu (RKO)</h4>
                </div>
                <ul class="list-group list-group-flush" id="rko-list">
                    <li class="list-group-item text-center">Yükleniyor...</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header header-teachers text-center">
                    <h4 class="mb-1">Öğretmen Kayıt Durumu</h4>
                    <div class="teacher-legend">
                        <span class="lg-dot lg-arrived"></span>Gelen
                        <span class="lg-dot lg-ongoing"></span>Devam eden ders
                    </div>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped table-hover mb-0 text-center">
                        <thead>
                            <tr>
                                <th class="text-start ps-4">Öğretmen İsmi</th>
                                <th>Kayıt Durumu (Gel/Top)</th>
                                <th>Başarı Yüzdesi</th>
                            </tr>
                        </thead>
                        <tbody id="teachers-list">
                            <tr><td colspan="3">Veriler yükleniyor...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function renderSchoolList(schoolData, elementId) {
        const listContainer = document.getElementById(elementId);
        if (!schoolData) {
            listContainer.innerHTML = '<li class="list-group-item text-danger">Veri bulunamadı</li>';
            return;
        }
        let totalStudents = 0;
        let htmlContent = "";
        schoolData.forEach(program => {
            const totalCount = program.count || 0;
            const newCount = program.new || 0;
            let oldCount = totalCount - newCount;
            if (oldCount < 0) oldCount = 0;
            totalStudents += totalCount;
            let newPercent = totalCount > 0 ? Math.round((newCount / totalCount) * 100) : 0;
            let oldPercent = totalCount > 0 ? Math.round((oldCount / totalCount) * 100) : 0;

            // Burslu sayısı — yalnızca JSON'da "burslu" alanı tanımlı programlarda gösterilir.
            const hasBurslu = program.burslu !== undefined;
            const bursluCount = program.burslu || 0;
            const bursluPercent = totalCount > 0 ? Math.round((bursluCount / totalCount) * 100) : 0;
            const bursluBlock = hasBurslu ? `
                            <div class="border-top mt-1 pt-1" style="color: var(--c-scholar);">
                                Burslu: <strong>${bursluCount}</strong> <span class="text-muted">(%${bursluPercent})</span>
                            </div>` : '';
            htmlContent += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="fw-medium">${program.name}</span>
                    <div class="d-flex align-items-center">
                        ${totalCount > 0 ? `
                        <div class="me-3 text-end" style="font-size: 0.7rem; line-height: 1.25;">
                            <div style="color: var(--c-ok-text);">Yeni: <strong>${newCount}</strong> <span class="text-muted">(%${newPercent})</span></div>
                            <div style="color: var(--c-ink-soft);">Eski: <strong>${oldCount}</strong> <span class="text-muted">(%${oldPercent})</span></div>${bursluBlock}
                        </div>` : ''}
                        <span class="badge bg-primary rounded-pill" style="min-width: 40px;">${totalCount}</span>
                    </div>
                </li>`;
        });
        htmlContent += `
            <li class="list-group-item d-flex justify-content-between align-items-center total-row">
                TOPLAM ÖĞRENCİ
                <span class="badge bg-dark rounded-pill" style="min-width: 40px;">${totalStudents}</span>
            </li>`;
        listContainer.innerHTML = htmlContent;
    }

    // Bir öğretmenin bar hücresi. Gelen (eşiğe göre renkli) + devam eden ders
    // (gri) dilimleri yığılır; sağdaki çatı yüzde ikisinin toplamıdır.
    // Eşik rengi de çatı yüzdeden hesaplanır: dersi süren öğrenci öğretmenin
    // başarısızlığı değildir, bu yüzden onu kırmızıya düşürmez.
    function teacherBarCell(arrived, ongoing, total) {
        const aPct = total > 0 ? (arrived / total) * 100 : 0;
        const oPct = total > 0 ? (ongoing / total) * 100 : 0;
        const cPct = aPct + oPct;
        const barColor = cPct < 25 ? 'bg-danger' : (cPct < 70 ? 'bg-warning text-dark' : 'bg-success');
        // Dar dilimde yazı taşar; etiket yalnızca sığdığında basılır, değer
        // her hâlükârda title olarak durur.
        const label = (pct) => pct >= 14 ? `%${Math.round(pct)}` : '';
        return `
            <div class="d-flex align-items-center gap-2">
                <div class="progress flex-grow-1" style="height: 18px;">
                    <div class="progress-bar ${barColor}" role="progressbar" style="width: ${aPct}%"
                         title="Gelen: ${arrived} (%${Math.round(aPct)})">${label(aPct)}</div>
                    <div class="progress-bar bar-ongoing" role="progressbar" style="width: ${oPct}%"
                         title="Devam eden ders: ${ongoing} (%${Math.round(oPct)})">${label(oPct)}</div>
                </div>
                <span class="pct-roof" title="Gelen + devam eden">%${Math.round(cPct)}</span>
            </div>`;
    }

    function renderTeachersTable(teacherData) {
        const tableBody = document.getElementById('teachers-list');
        if (!teacherData) {
            tableBody.innerHTML = '<tr><td colspan="3" class="text-danger">Veri bulunamadı</td></tr>';
            return;
        }
        let totalArrived = 0;
        let totalOngoing = 0;
        let totalPossible = 0;
        let htmlContent = "";
        teacherData.forEach(teacher => {
            const total   = teacher.total   || 0;
            const arrived = teacher.arrived || 0;
            // "ongoing" alanı olmayan dönemlerde 0; gelenle birlikte toplamı
            // asla aşamaz.
            const ongoing = Math.min(teacher.ongoing || 0, Math.max(total - arrived, 0));
            totalArrived  += arrived;
            totalOngoing  += ongoing;
            totalPossible += total;
            htmlContent += `
                <tr>
                    <td class="text-start ps-4">${teacher.name}</td>
                    <td>
                        <div>${arrived} / ${total}</div>
                        ${ongoing > 0 ? `<div class="ongoing-note">Devam eden ders: ${ongoing}</div>` : ''}
                    </td>
                    <td>${teacherBarCell(arrived, ongoing, total)}</td>
                </tr>`;
        });
        htmlContent += `
            <tr class="total-row">
                <td class="text-start ps-4">GENEL TOPLAM</td>
                <td>
                    <div><strong>${totalArrived} / ${totalPossible}</strong></div>
                    ${totalOngoing > 0 ? `<div class="ongoing-note">Devam eden ders: ${totalOngoing}</div>` : ''}
                </td>
                <td>${teacherBarCell(totalArrived, totalOngoing, totalPossible)}</td>
            </tr>`;
        tableBody.innerHTML = htmlContent;
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetch('./kayit.json')
            .then(r => { if (!r.ok) throw new Error(`HTTP hata: ${r.status}`); return r.json(); })
            .then(data => {
                renderSchoolList(data.rko, 'rko-list');
                renderTeachersTable(data.teachers);
            })
            .catch(error => {
                document.getElementById('rko-list').innerHTML = `<li class="list-group-item text-danger">Veri yüklenemedi: ${error.message}</li>`;
            });

        const toggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        toggleBtn.addEventListener('click', () => {
            const newTheme = htmlElement.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-bs-theme', newTheme);
            toggleBtn.textContent = newTheme === 'light' ? '🌙 Dark Mod' : '☀️ Light Mod';
            toggleBtn.classList.toggle('btn-outline-primary');
            toggleBtn.classList.toggle('btn-outline-warning');
        });
    });
</script>
</body>
</html>
