<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuran Okulu — 2026 Güz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ── RENK TOKENLARI ──────────────────────────────────────────
           Projedeki TÜM renkler buradan türer. Palet değişimi = bu blok.
           Bootstrap'in semantik değişkenleri de buraya bağlandığı için
           yüzde eşiklerinin (bg-danger/bg-warning/bg-success) mantığı
           değişmeden rengi temaya uyar. */
        :root {
            --c-brand:        #25375F;   /* ana marka — nav, RKO başlığı, aktif filtre */
            --c-brand-2:      #339999;   /* marka gradyan ucu */
            --c-accent:       #B85C38;   /* ikincil vurgu — öğretmen başlığı */
            --c-accent-2:     #2E2219;

            --c-ok:           #7A9155;   /* yüzde ≥70 ve "Yeni" satırı */
            --c-warn:         #B57F24;   /* yüzde 25–70 */
            --c-bad:          #D9644A;   /* yüzde <25 */
            --c-scholar:      #8A5E12;   /* burslu satırı */

            --c-bg:           #F4F1EB;   /* sayfa zemini */
            --c-surface:      #FAF9F6;   /* kart zemini */
            --c-text:         #25375F;

            --c-border:       rgba(37,55,95,0.10);
            --c-border-2:     rgba(37,55,95,0.22);
            --c-shadow:       rgba(37,55,95,0.06);
            --c-shadow-lg:    rgba(37,55,95,0.14);
            --c-zebra:        rgba(37,55,95,0.045);
            --c-ink-soft:     rgba(37,55,95,0.55);

            /* Mevsim aksanları */
            --c-bahar:   #6B7C51;  --c-bahar-2: #C5D098;
            --c-yaz:     #C8922F;  --c-yaz-2:   #F4C430;
            --c-guz:     #B85C38;  --c-guz-2:   #F0A57D;
            --c-kis:     #25375F;  --c-kis-2:   #3AADA3;
            --c-bahar-bg: #E8EDDF; --c-bahar-fg: #3F4C2C;
            --c-yaz-bg:   #FAEFD5; --c-yaz-fg:   #6B4A0E;
            --c-guz-bg:   #F7E4DA; --c-guz-fg:   #7A3418;
            --c-kis-bg:   #DCEDEB; --c-kis-fg:   #17544F;

            /* Grafik serileri — program sayısı kadar sırayla kullanılır */
            --c-series-1: #25375F;
            --c-series-2: #3AADA3;
            --c-series-3: #B85C38;
            --c-series-4: #C8922F;
            --c-series-5: #6B7C51;
            --c-series-6: #D4B896;
            --c-series-7: #56D8CC;
            --c-series-8: #33404E;

            /* Bootstrap köprüsü — utility sınıfları -rgb değişkenlerini okur,
               bu yüzden hem düz hem rgb biçimi tanımlanır. Yüzde eşiklerinin
               mantığı değişmez, yalnızca renkleri palete döner. */
            --bs-primary: var(--c-brand);      --bs-primary-rgb: 37,55,95;
            --bs-success: var(--c-ok);         --bs-success-rgb: 122,145,85;
            --bs-warning: var(--c-warn);       --bs-warning-rgb: 181,127,36;
            --bs-danger:  var(--c-bad);        --bs-danger-rgb:  217,100,74;
            --bs-dark:    var(--c-brand);      --bs-dark-rgb:    37,55,95;
            --bs-secondary-color: var(--c-ink-soft);
            --bs-body-bg: var(--c-bg);         --bs-body-bg-rgb: 244,241,235;
            --bs-body-color: var(--c-text);    --bs-body-color-rgb: 37,55,95;
            --bs-emphasis-color-rgb: 37,55,95;
            --bs-border-color: var(--c-border-2);
        }
        [data-bs-theme="dark"] {
            --c-bg:        #25375F;
            --c-surface:   #33404E;
            --c-text:      #F4F1EB;
            --c-border:    rgba(244,241,235,0.16);
            --c-border-2:  rgba(244,241,235,0.32);
            --c-shadow:    rgba(26,37,64,0.42);
            --c-shadow-lg: rgba(26,37,64,0.60);
            --c-zebra:     rgba(244,241,235,0.08);
            --c-ink-soft:  rgba(244,241,235,0.55);
            --c-scholar:   #F4C430;
            --c-bahar-bg: #2A3328; --c-bahar-fg: #C5D098;
            --c-yaz-bg:   #3A2A0C; --c-yaz-fg:   #F4C430;
            --c-guz-bg:   #3A241A; --c-guz-fg:   #F0A57D;
            --c-kis-bg:   #14343B; --c-kis-fg:   #56D8CC;

            --bs-body-bg-rgb: 37,55,95;
            --bs-body-color-rgb: 244,241,235;
            --bs-emphasis-color-rgb: 244,241,235;
            --bs-dark: #1A2540;    --bs-dark-rgb: 26,37,64;
            /* Koyu zeminle çakışan iki seri, sitenin -on-dark yöntemiyle açıldı */
            --c-series-1: #8FA8D8;
            --c-series-8: #A9B4C4;
        }
        /* Kart zemini sayfadan bir ton ayrışır (Paper White / Slate Blue) */
        .card { background-color: var(--c-surface); }
        body {
            transition: background-color 0.3s, color 0.3s;
            padding-top: 20px;
            padding-bottom: 50px;
        }
        .card {
            margin-bottom: 20px;
            border: none;
            box-shadow: 0 4px 6px var(--c-shadow);
        }
        .header-rko { background-color: var(--c-brand); color: white; }
        .header-teachers { background-color: var(--c-accent); color: white; }
        .total-row {
            font-weight: bold;
            background-color: var(--c-zebra) !important;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <a href="../index.html" class="btn btn-outline-secondary btn-sm">← Dashboard</a><br>
            <h1 class="fw-bold mb-0">2026 Güz</h1>
        </div>
        <button id="themeToggle" class="btn btn-outline-primary">🌙 Dark Mod</button>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header header-rko text-center">
                    <h4>Kuran Okulu (RKO)</h4>
                </div>
                <ul class="list-group list-group-flush" id="rko-list">
                    <li class="list-group-item text-center">Yükleniyor...</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header header-teachers text-center">
                    <h4>Öğretmen Kayıt Durumu</h4>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped table-hover mb-0 text-center">
                        <thead>
                            <tr>
                                <th class="text-start ps-4">Öğretmen İsmi</th>
                                <th>Kayıt Durumu (Gel/Top)</th>
                                <th>Başarı Yüzdesi</th>
                            </tr>
                        </thead>
                        <tbody id="teachers-list">
                            <tr><td colspan="3">Veriler yükleniyor...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function renderSchoolList(schoolData, elementId) {
        const listContainer = document.getElementById(elementId);
        if (!schoolData) {
            listContainer.innerHTML = '<li class="list-group-item text-danger">Veri bulunamadı</li>';
            return;
        }
        let totalStudents = 0;
        let htmlContent = "";
        schoolData.forEach(program => {
            const totalCount = program.count || 0;
            const newCount = program.new || 0;
            let oldCount = totalCount - newCount;
            if (oldCount < 0) oldCount = 0;
            totalStudents += totalCount;
            let newPercent = totalCount > 0 ? Math.round((newCount / totalCount) * 100) : 0;
            let oldPercent = totalCount > 0 ? Math.round((oldCount / totalCount) * 100) : 0;

            // Burslu sayısı — yalnızca JSON'da "burslu" alanı tanımlı programlarda gösterilir.
            const hasBurslu = program.burslu !== undefined;
            const bursluCount = program.burslu || 0;
            const bursluPercent = totalCount > 0 ? Math.round((bursluCount / totalCount) * 100) : 0;
            const bursluBlock = hasBurslu ? `
                            <div class="border-top mt-1 pt-1" style="color: var(--c-scholar);">
                                Burslu: <strong>${bursluCount}</strong> <span class="text-muted">(%${bursluPercent})</span>
                            </div>` : '';
            htmlContent += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="fw-medium">${program.name}</span>
                    <div class="d-flex align-items-center">
                        ${totalCount > 0 ? `
                        <div class="me-3 text-end" style="font-size: 0.7rem; line-height: 1.25; opacity: 0.85;">
                            <div class="text-success">Yeni: <strong>${newCount}</strong> <span class="text-muted">(%${newPercent})</span></div>
                            <div class="text-secondary">Eski: <strong>${oldCount}</strong> <span class="text-muted">(%${oldPercent})</span></div>${bursluBlock}
                        </div>` : ''}
                        <span class="badge bg-primary rounded-pill" style="min-width: 40px;">${totalCount}</span>
                    </div>
                </li>`;
        });
        htmlContent += `
            <li class="list-group-item d-flex justify-content-between align-items-center total-row">
                TOPLAM ÖĞRENCİ
                <span class="badge bg-dark rounded-pill" style="min-width: 40px;">${totalStudents}</span>
            </li>`;
        listContainer.innerHTML = htmlContent;
    }

    function renderTeachersTable(teacherData) {
        const tableBody = document.getElementById('teachers-list');
        if (!teacherData) {
            tableBody.innerHTML = '<tr><td colspan="3" class="text-danger">Veri bulunamadı</td></tr>';
            return;
        }
        let totalArrived = 0;
        let totalPossible = 0;
        let htmlContent = "";
        teacherData.forEach(teacher => {
            totalArrived += teacher.arrived;
            totalPossible += teacher.total;
            let percentage = teacher.total > 0 ? ((teacher.arrived / teacher.total) * 100).toFixed(1) : 0;
            let badgeColor = percentage < 25 ? 'bg-danger' : (percentage < 70 ? 'bg-warning text-dark' : 'bg-success');
            htmlContent += `
                <tr>
                    <td class="text-start ps-4">${teacher.name}</td>
                    <td>${teacher.arrived} / ${teacher.total}</td>
                    <td>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar ${badgeColor}" role="progressbar" style="width: ${percentage}%">%${percentage}</div>
                        </div>
                    </td>
                </tr>`;
        });
        let totalPercentage = totalPossible > 0 ? ((totalArrived / totalPossible) * 100).toFixed(1) : 0;
        htmlContent += `
            <tr class="total-row">
                <td class="text-start ps-4">GENEL TOPLAM</td>
                <td><strong>${totalArrived} / ${totalPossible}</strong></td>
                <td><strong>%${totalPercentage}</strong></td>
            </tr>`;
        tableBody.innerHTML = htmlContent;
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetch('./kayit.json')
            .then(r => { if (!r.ok) throw new Error(`HTTP hata: ${r.status}`); return r.json(); })
            .then(data => {
                renderSchoolList(data.rko, 'rko-list');
                renderTeachersTable(data.teachers);
            })
            .catch(error => {
                document.getElementById('rko-list').innerHTML = `<li class="list-group-item text-danger">Veri yüklenemedi: ${error.message}</li>`;
            });

        const toggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        toggleBtn.addEventListener('click', () => {
            const newTheme = htmlElement.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-bs-theme', newTheme);
            toggleBtn.textContent = newTheme === 'light' ? '🌙 Dark Mod' : '☀️ Light Mod';
            toggleBtn.classList.toggle('btn-outline-primary');
            toggleBtn.classList.toggle('btn-outline-warning');
        });
    });
</script>
</body>
</html>
